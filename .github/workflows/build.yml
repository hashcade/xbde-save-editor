name: build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-15, macos-15-intel, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet build XbdeEditor.slnx -c Release --nologo
      - run: dotnet run --project test/Core.Test.csproj -c Release --no-build
      - run: dotnet run --project test/Gui.Smoke.csproj -c Release --no-build
      - run: dotnet run --project cli/Cli.csproj -c Release --no-build -- --version
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python tools/test_cli.py --cli cli/bin/Release/net10.0/XbdeEditor.Cli.dll
